# tts/ stt/ sim/ 는 서로 import 하지 않는 독립 모듈이다.
# 각 모듈을 자기 폴더에서, 그 모듈 테스트에 필요한 최소 의존성만 설치해 돌린다
# (마이크·스피커·GPU·Whisper 모델·로봇 없이 동작하는 테스트만 있음).
name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # 재생은 표준 라이브러리만. numpy·av 는 generate_wavs 후처리 시험용 (edge-tts 는 호출 안 함)
          - module: tts
            deps: pytest numpy av
          # Whisper·sounddevice·webrtcvad 는 지연 import 라 가짜 객체로 시험 (torch 불필요)
          - module: stt
            deps: pytest numpy scipy
          # render="none" 시험만. SO-101 MJCF/STL 은 아래에서 따로 받는다
          - module: sim
            deps: pytest numpy mujoco
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.module }}/requirements.txt

      - name: SO-101 assets (sim)
        if: matrix.module == 'sim'
        uses: actions/checkout@v4
        with:
          repository: TheRobotStudio/SO-ARM100
          path: sim/third_party/SO-ARM100
          sparse-checkout: Simulation/SO101
          filter: blob:none

      - name: OSMesa (sim, mujoco 렌더 백엔드 import 용)
        if: matrix.module == 'sim'
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libosmesa6

      - name: Install
        run: python -m pip install ${{ matrix.deps }}

      - name: pytest
        working-directory: ${{ matrix.module }}
        env:
          MUJOCO_GL: osmesa
          SO101_DIR: ${{ github.workspace }}/sim/third_party/SO-ARM100/Simulation/SO101
        run: python -m pytest -q tests

  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.16.0
      - run: ruff check .
      - run: ruff format --check .
